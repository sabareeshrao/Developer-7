spring:
  application:
    name: geoops
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: GeoOps
    domain: GIS operations
    company: AtlasGrid Geospatial Systems
